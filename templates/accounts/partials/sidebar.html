{% load static %}

<aside class="settings-side">

    <!-- USER CARD -->
    <div class="user-card">
        <div class="avatar-ring">
            {% if user.profile.avatar %}
                <img src="{{ user.profile.avatar.url }}" alt="avatar">
            {% else %}
                <img src="{% static 'img/default-avatar.png' %}" alt="avatar">
            {% endif %}
        </div>

        <h3>{{ user.get_full_name|default:user.email }}</h3>
        <p class="muted">Member Account</p>
    </div>

    <!-- NAVIGATION -->
    <div class="settings-nav">

        <div class="nav-item active">Profile</div>
        <div class="nav-item">Security</div>
        <div class="nav-item">Notifications</div>

        <div class="nav-divider"></div>

        <div class="nav-group-title">Your Activity</div>

        <a href="{% url 'accounts:engagement' %}" class="nav-item">
            Engagement
        </a>

        <div class="nav-divider"></div>

        <div class="nav-item danger">Delete Account</div>

    </div>

</aside>
