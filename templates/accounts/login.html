
<form method='post'>
{% csrf_token %}
<h2>Login</h2>
<input type="email" name="username" placeholder="Email" required>
<input type="password" name="password" placeholder="Password" required>
<button type="submit">Login</button>
{% if form.errors %}
        <p style="color:red;">
            Invalid email or password
        </p>
{% endif %}
</form>
